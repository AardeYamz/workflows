name: Bump repos

# Opens one PR per listed repo that runs a bump command there and proposes the result, on one fixed branch per repo (a newer
# run updates the open PR instead of opening another). PRs are merged only with `auto-merge` (below). A repo where the command changes nothing gets
# no PR. Used for "repin the shared workflows" (this repo's bump-consumers.yml) and "pin the newest theme" (yl-theme).
#
# With `auto-merge: true` the job then waits for the PR's checks (on the head commit it opened, polled once a minute through the REST API, so no
# consumer runner is held and the GraphQL quota is left alone) and merges once every check has finished green; a failed or cancelled check leaves the PR open and
# fails this job. "Green" needs at least one check reported and the same all-green result on two polls in a row, so a snapshot
# taken before the consumer's CI has queued is not mistaken for success. The merge uses the PAT, so the consumer's push
# workflows (deploys) run as usual. There is no branch protection to lean on (`gh pr merge --auto` would merge on sight).
#
# Needs the secret CONSUMER_PAT: a fine-grained token with Contents and Pull requests write on the listed repos.
# GITHUB_TOKEN cannot reach other repos, and PRs it opened would not start their CI. The command runs repo code with no
# credentials on disk (the PAT is only handed to create-pull-request).
#
# Caller:
#   jobs:
#     bump:
#       uses: AardeYamz/workflows/.github/workflows/bump-repos.yml@<sha> # <tag>
#       with:
#         branch: chore/theme-bump
#         title: Bump theme to ${{ needs.gate.outputs.version }}
#         body: Pins theme.json to the newest theme.
#         repos: >-
#           [{"repo": "trips", "runtime": "python", "cmd": "python scripts/theme.py --bump", "paths": "theme.json"},
#            {"repo": "lam-yan-lik", "runtime": "node", "cmd": "node tools/theme.js --bump", "paths": "theme.json",
#             "notes": "Check the preview before merging."}]
#       secrets:
#         consumer-pat: ${{ secrets.CONSUMER_PAT }}
#
# Each entry: repo (name under the owner), and optionally cmd (run in the checkout) and paths (space-separated, what to commit)
# when they differ from the `cmd` and `paths` inputs, runtime (node, python or empty) and notes (appended to the PR body). `env` is a JSON object of extra environment for every cmd.
on:
  workflow_call:
    inputs:
      repos:
        description: "JSON array of objects: repo, and optionally cmd, paths, runtime, notes."
        type: string
        required: true
      cmd:
        description: Default bump command for entries that have none of their own.
        type: string
        default: ''
      paths:
        description: Default space-separated paths to commit, for entries that have none of their own.
        type: string
        default: ''
      branch:
        description: Fixed branch the PRs are opened from.
        type: string
        required: true
      title:
        description: PR title and commit message.
        type: string
        required: true
      body:
        description: PR body (notes are appended per repo).
        type: string
        default: ''
      env:
        description: JSON object of extra environment variables for every cmd, such as TAG and SHA.
        type: string
        default: '{}'
      auto-merge:
        description: Wait for each PR's checks and merge it once they all pass.
        type: boolean
        default: false
      merge-method:
        description: squash, merge or rebase (with auto-merge).
        type: string
        default: squash
      merge-timeout-minutes:
        description: How long to wait for a PR's checks before giving up, in minutes (with auto-merge, at most 120).
        type: number
        default: 60
      owner:
        description: Owner of the listed repos. Empty means this repo's owner.
        type: string
        default: ''
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''
    secrets:
      consumer-pat:
        description: Fine-grained token with Contents and Pull requests write on the listed repos.
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: ${{ inputs.auto-merge && 135 || 15 }}  # a ceiling; the wait itself is bounded by merge-timeout-minutes
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.owner || github.repository_owner }}/${{ matrix.entry.repo }}
          token: ${{ secrets.consumer-pat }}
          persist-credentials: false

      - if: matrix.entry.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - if: matrix.entry.runtime == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: ''

      - name: Run the bump
        env:
          CMD: ${{ matrix.entry.cmd || inputs.cmd }}
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          while IFS= read -r kv; do export "${kv?}"; done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$EXTRA_ENV")
          eval "$CMD"

      - id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.consumer-pat }}
          branch: ${{ inputs.branch }}
          add-paths: ${{ matrix.entry.paths || inputs.paths }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          body: |
            ${{ inputs.body }}

            ${{ matrix.entry.notes }}

            🤖 Generated with [Claude Code](https://claude.com/claude-code)

      - name: Wait for the PR's checks, then merge
        if: inputs.auto-merge && steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.consumer-pat }}
          REPO: ${{ inputs.owner || github.repository_owner }}/${{ matrix.entry.repo }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          BRANCH: ${{ inputs.branch }}
          METHOD: ${{ inputs.merge-method }}
          WAIT_MINUTES: ${{ inputs.merge-timeout-minutes }}
        run: |
          case "$METHOD" in squash|merge|rebase) ;; *) echo "::error::merge-method must be squash, merge or rebase"; exit 1 ;; esac
          # REST only: the GraphQL quota (`gh pr view`, `gh pr checks`, `gh pr merge`) is shared by every job here and by
          # anything else using the PAT, and ran out mid-wait. A failed call is retried on the next poll, not fatal.
          tries=$(( (WAIT_MINUTES > 120 ? 120 : WAIT_MINUTES) ))
          green_sha=''
          for _ in $(seq 1 "$tries"); do
            sleep 60
            read -r pr_state sha < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"' 2>"$RUNNER_TEMP/api.err" || true)
            [ -n "${sha:-}" ] || { cat "$RUNNER_TEMP/api.err" >&2; continue; }
            [ "$pr_state" = open ] || { echo "PR is $pr_state; nothing to merge."; exit 0; }
            checks=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, conclusion}' 2>"$RUNNER_TEMP/api.err" | jq -cs '.') || checks=''
            [ -n "$checks" ] || { cat "$RUNNER_TEMP/api.err" >&2; continue; }
            if jq -e 'any(.[]; .conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure"))' <<<"$checks" >/dev/null; then
              echo "::error::$REPO#$PR: a check failed; leaving the PR open for review."
              jq -r '.[] | select(.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure")) | "  \(.name): \(.conclusion)"' <<<"$checks"
              exit 1
            fi
            # Green: at least one check, none still running, the same head commit on two polls in a row.
            if jq -e 'length > 0 and all(.[]; .conclusion | IN("success", "neutral", "skipped"))' <<<"$checks" >/dev/null; then
              if [ "$green_sha" = "$sha" ]; then
                gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method="$METHOD" -f sha="$sha" --silent
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent || true
                echo "Merged $REPO#$PR at $sha" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              green_sha=$sha  # confirm on the next poll
            else
              green_sha=''
            fi
          done
          echo "::error::$REPO#$PR: checks did not finish in time; leaving the PR open."
          exit 1
