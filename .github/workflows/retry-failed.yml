name: Retry failed runs

# Re-runs only the failed jobs of a run that ended in `failure`, up to a total number of attempts. GitHub has no setting for
# this, and a called workflow cannot define its own trigger, so the caller owns the `workflow_run` trigger and lists which
# workflows to retry. Cancelled and timed-out runs are not retried (a newer run usually superseded a cancelled one).
#
# By default (only-infra) a run is re-run only when one of its failed jobs was lost with its runner: the runner got a
# shutdown signal (Docker restarted, the host rebooted) or lost contact with GitHub. A real failure, such as a broken test,
# is left alone, so it reports at once instead of after every attempt. With only-infra: false every failure is re-run.
#
# The wait before a re-run doubles with each attempt (30 s, 60 s, 120 s, ... up to max-delay-seconds), so a longer outage gets
# more time to clear.
#
# Runs on the default branch's copy of the caller, with no PR code checked out: it only calls `gh run rerun`.
# Runs from forks are skipped (their token cannot re-run anything).
#
# Caller:
#   on: # zizmor: ignore[dangerous-triggers]
#     workflow_run:
#       workflows: [CI, Build and deploy]
#       types: [completed]
#   permissions: {}
#   jobs:
#     retry:
#       permissions:
#         actions: write   # re-runs the failed jobs
#       uses: AardeYamz/workflows/.github/workflows/retry-failed.yml@<sha> # <tag>
#       with:
#         max-attempts: 3
on:
  workflow_call:
    inputs:
      max-attempts:
        description: Total attempts, the first included. 3 means the original run plus up to two re-runs.
        type: number
        default: 3
      delay-seconds:
        description: Wait before the first re-run. It doubles with each attempt (30, 60, 120, ...), so a runner or service that just hiccuped can recover.
        type: number
        default: 30
      max-delay-seconds:
        description: Upper bound on the wait (at most 1800).
        type: number
        default: 600
      only-infra:
        description: Re-run only when a failed job was lost with its runner (shutdown signal, lost communication). False re-runs every failure.
        type: boolean
        default: true
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''

permissions: {}

jobs:
  retry:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < inputs.max-attempts
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 40   # covers the longest allowed wait (30 minutes) plus the re-run call
    permissions:
      actions: write
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          MAX: ${{ inputs.max-attempts }}
          DELAY: ${{ inputs.delay-seconds }}
          MAX_DELAY: ${{ inputs.max-delay-seconds }}
          NAME: ${{ github.event.workflow_run.name }}
          ONLY_INFRA: ${{ inputs.only-infra }}
        run: |
          if [ "$ONLY_INFRA" = true ]; then
            # A job is a check run with the same id. A runner that lost contact leaves an annotation and no log; one that was
            # shut down mid-job only says so at the end of the job's log (its annotation is just "The operation was canceled").
            lost=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure") | .id' |
              while read -r id; do
                gh api "repos/$GH_REPO/check-runs/$id/annotations" --jq '.[].message' || true
                # curl, not gh api: gh refuses to print a log that holds terminal escape sequences.
                curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/jobs/$id/logs" 2>/dev/null | tail -n 50 || true
              done | grep -Eci 'runner has received a shutdown signal|lost communication with the server|was not acquired by runner' || true)
            if [ "$lost" = 0 ]; then echo "$NAME (run $RUN_ID) failed, but no job was lost with its runner; not re-running"; exit 0; fi
            echo "$NAME (run $RUN_ID): $lost sign(s) of a lost runner"
          fi
          # Exponential backoff: DELAY after the first failure, then double on each further attempt, capped.
          cap=$(( MAX_DELAY > 1800 ? 1800 : MAX_DELAY ))
          delay=$(( DELAY << (ATTEMPT - 1) ))
          delay=$(( delay > cap || delay < 0 ? cap : delay ))
          echo "$NAME (run $RUN_ID) failed on attempt $ATTEMPT of $MAX; re-running its failed jobs in ${delay}s"
          sleep "$delay"
          # A run that was re-run or superseded by hand in the meantime has a newer attempt: leave it alone.
          current=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$current" != "$ATTEMPT" ]; then echo "run is already on attempt $current; nothing to do"; exit 0; fi
          gh run rerun "$RUN_ID" --failed
