name: Terraform plan comment

# On a pull request, runs a speculative plan of a Terraform root whose workspace lives in HCP Terraform (CLI-driven
# `terraform plan` against the root's cloud block; HCP runs it with the workspace's own variables and never applies it)
# and posts the output as one PR comment, updated in place on each push. Email addresses are redacted from the log and
# the comment. The job fails when the plan fails, after commenting. Without the tf-api-token secret (Dependabot and fork
# PRs get no secrets) it skips with a notice. Pair it with terraform-lint.yml and terraform-release.yml.
#
# A speculative plan runs the PR's Terraform code with the workspace's variables, so only same-repo PRs (which get
# secrets) can trigger one; fork PRs cannot.
#
# tf-api-token: an HCP Terraform team token (or user token) that can plan the workspace (team permission "plan").
# Caller:
#   jobs:
#     plan:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: AardeYamz/workflows/.github/workflows/terraform-plan-comment.yml@<sha> # <tag>
#       secrets:
#         tf-api-token: ${{ secrets.TF_API_TOKEN }}
on:
  workflow_call:
    inputs:
      directory:
        description: Terraform root directory (the one with the cloud block).
        type: string
        default: terraform
      terraform-version:
        description: Terraform version. Keep it the same as the workspace's.
        type: string
        default: 1.17.2
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''
    secrets:
      tf-api-token:
        description: HCP Terraform token that can plan the workspace.
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Speculative plan
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the plan comment
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.directory }}
    env:
      HAS_TOKEN: ${{ secrets.tf-api-token != '' }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Skip without a token
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::No tf-api-token secret (Dependabot or fork PR), so no plan."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_token: ${{ secrets.tf-api-token }}
          terraform_wrapper: false

      - name: Init
        if: env.HAS_TOKEN == 'true'
        run: terraform init -input=false -no-color

      # -lock=false: a speculative plan never writes state, so it need not wait on a run holding the workspace lock.
      # The raw output never reaches the log: it goes through the redaction first.
      - name: Plan
        id: plan
        if: env.HAS_TOKEN == 'true'
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false 2>&1 \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<redacted>/g' > "$RUNNER_TEMP/plan.txt"
          status=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/plan.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One comment per PR and directory, found by its marker and updated in place.
      - name: Comment the plan on the PR
        if: env.HAS_TOKEN == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
          TF_DIR: ${{ inputs.directory }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            // Drop the upload preamble; keep from the run link on.
            const start = plan.indexOf('To view this run in a browser');
            if (start > 0) plan = plan.slice(start);
            if (plan.length > 60000) plan = '…(truncated)\n' + plan.slice(-60000);
            const ok = process.env.PLAN_STATUS === '0';
            const summary = !ok ? 'Plan failed.'
              : (plan.match(/^(Plan: .*|No changes\..*)$/m) || [])[0]
              || (/^Changes to Outputs:/m.test(plan) ? 'Only output values change; no infrastructure changes.' : 'Plan finished.');
            const dir = process.env.TF_DIR;
            const marker = `<!-- terraform-plan-comment:${dir} -->`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `### ${ok ? '✅' : '❌'} Terraform plan: \`${dir}\` (${sha})`,
              summary,
              '<details><summary>Plan output</summary>',
              '',
              '```',
              plan.trim(),
              '```',
              '</details>',
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - name: Fail if the plan failed
        if: env.HAS_TOKEN == 'true' && steps.plan.outputs.status != '0'
        working-directory: .
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          echo "::error::terraform plan exited $PLAN_STATUS; see the PR comment or the log."
          exit 1
