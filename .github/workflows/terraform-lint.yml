name: Terraform lint

# Format check and validate for a Terraform root that runs elsewhere (HCP Terraform). No backend and no credentials: it
# never plans. Pair it with terraform-release.yml so only linted commits are planned and applied.
# Caller:
#   jobs:
#     terraform:
#       permissions:
#         contents: read
#       uses: AardeYamz/workflows/.github/workflows/terraform-lint.yml@<sha> # <tag>
on:
  workflow_call:
    inputs:
      directory:
        description: Terraform root directory.
        type: string
        default: terraform
      terraform-version:
        description: Terraform version. Keep it the same as the workspace's.
        type: string
        default: 1.17.2
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Format and validate
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init without a backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
