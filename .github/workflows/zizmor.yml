name: Workflow security lint

# Lints the caller's workflow files with zizmor: template injection, credential persistence, overscoped tokens,
# unpinned actions, cache poisoning, impostor commits.
# By default the findings are uploaded as SARIF to code scanning, which needs GitHub Advanced Security: public repos have
# it, private ones on a personal plan do not. Those pass advanced-security: false, and the findings become annotations
# and fail the job instead.
# Caller (grant all three: a called job may not ask for more than its caller grants):
#   jobs:
#     zizmor:
#       permissions:
#         contents: read
#         security-events: write  # uploads the SARIF
#         actions: read           # lets the upload read this run's metadata (needed in private repos)
#       uses: AardeYamz/workflows/.github/workflows/zizmor.yml@<sha> # <tag>
#       with:
#         advanced-security: false  # private repos without code scanning
on:
  workflow_call:
    inputs:
      advanced-security:
        description: Upload SARIF to code scanning (true), or report the findings as annotations and fail (false).
        type: boolean
        default: true
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  zizmor:
    name: Lint workflows (zizmor)
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: ${{ inputs.advanced-security }}
          annotations: ${{ !inputs.advanced-security }}
