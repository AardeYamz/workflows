name: Bump consumers

# After a release tag (vX.Y.Z) is pushed, opens one PR per consumer repo that moves its pinned
# `uses: AardeYamz/workflows/...@<sha> # vX.Y.Z` lines to the new release. A repo already on it gets no PR.
# One fixed branch (chore/workflows-bump) per consumer: a newer release updates the open PR instead of opening another.
# Each PR is merged once all of its checks pass (bump-repos.yml's auto-merge); a PR with a failing check stays open and fails
# that repo's matrix job. Floating tags (v1) are ignored; only full 40-character SHA pins are rewritten.
#
# The repos come from repos.json in the private AardeYamz/personal-repos (every repo except this one).
# Needs the secret CONSUMER_PAT: a fine-grained token with Contents read on personal-repos and Contents and Pull requests
# write on the repos listed there.
# GITHUB_TOKEN cannot reach other repos, and PRs it opened would not start their CI.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump consumers to (default is the newest vX.Y.Z tag).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      repos: ${{ steps.r.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the repo list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AardeYamz/personal-repos
          token: ${{ secrets.CONSUMER_PAT }}
          path: list
          sparse-checkout: repos.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: r
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          [ -n "$tag" ] || { [ "$REF_TYPE" = tag ] && tag="$REF_NAME"; } \
            || tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          sha=$(git rev-parse "refs/tags/$tag^{commit}")
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "repos=$(jq -c 'map(select(.repo != "workflows"))' list/repos.json)"  # one line: a step output can't span lines
          } >> "$GITHUB_OUTPUT"
          echo "Bumping consumers to $tag ($sha)" >> "$GITHUB_STEP_SUMMARY"

  bump:
    needs: release
    uses: ./.github/workflows/bump-repos.yml
    with:
      branch: chore/workflows-bump
      paths: .github/workflows
      # Only full 40-character SHA pins are rewritten; floating tags (v1) are left alone.
      cmd: |
        shopt -s nullglob
        files=(.github/workflows/*.yml .github/workflows/*.yaml)
        [ ${#files[@]} -gt 0 ] || exit 0
        perl -pi -e 's{(AardeYamz/workflows/[\w./-]+@)[0-9a-f]{40}( +# +)v\d+\.\d+\.\d+}{$1$ENV{SHA}$2$ENV{TAG}}g' "${files[@]}"
      title: Bump shared workflows to ${{ needs.release.outputs.tag }}
      body: Repins the `AardeYamz/workflows` reusable workflows to `${{ needs.release.outputs.tag }}` (opened by that repo's Bump consumers workflow).
      env: '{"TAG": "${{ needs.release.outputs.tag }}", "SHA": "${{ needs.release.outputs.sha }}"}'
      repos: ${{ needs.release.outputs.repos }}
      auto-merge: true
    secrets:
      consumer-pat: ${{ secrets.CONSUMER_PAT }}
