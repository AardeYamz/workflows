name: Workflow syntax lint

# Lints the caller's workflow files with actionlint: YAML and expression syntax, unknown inputs and outputs, bad `needs`,
# `with:` keys an action does not take, and shellcheck on every `run:` script. Catches a broken workflow before it merges;
# zizmor.yml covers security.
# Caller:
#   jobs:
#     actionlint:
#       permissions:
#         contents: read
#       uses: AardeYamz/workflows/.github/workflows/actionlint.yml@<sha> # <tag>
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Empty means the caller's vars.RUNNER, else ubuntu-26.04.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow syntax (actionlint)
    runs-on: ${{ inputs.runs-on || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true
          pyflakes: false   # installed with pipx, which the self-hosted runner (vars.RUNNER) does not have
          cache: false
