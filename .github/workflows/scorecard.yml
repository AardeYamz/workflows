name: OpenSSF Scorecard

# Supply-chain posture scan of this repo (branch protection, pinned actions, token permissions, ...). Results go to code
# scanning and the public Scorecard API. Runs in this repo only: Scorecard refuses to publish from a reusable workflow.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Held at v2.5.0, the newest release whose image pulls: v2.6.0's ghcr index references deleted manifests
      # (ossf/scorecard-action#1752). Move to the latest release once that is fixed.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
