# Bumps the actions the templates pin, and the linters' npm dependencies, once here for every caller.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/mermaid-lint", "/d2-lint"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories: ["/mermaid-lint", "/d2-lint"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
